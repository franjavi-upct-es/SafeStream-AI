# services/dashboard/nginx.conf
#
# Reverse-proxies API and WebSocket traffic to the inference service so the
# browser sees a single origin. The hostname `inference` is resolved by the
# Docker Compose network at runtime.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets; nginx-alpine ships with the gzip module enabled.
  gzip on;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml;
  gzip_min_length 1024;

  # ----------------------------------------------------------------------
  # Static assets: long cache for hashed bundles, short cache for the
  # entry HTML so deploys roll out without manual refresh.
  # ----------------------------------------------------------------------
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ----------------------------------------------------------------------
  # SPA routing: any unknown path falls through to index.html so the
  # React Router can handle it client-side.
  # ----------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ----------------------------------------------------------------------
  # /api/* -> inference REST surface
  # ----------------------------------------------------------------------
  location /api/ {
    proxy_pass http://inference:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
