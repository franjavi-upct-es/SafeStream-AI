# services/producer/pyproject.toml
[project]
name = "safestream-producer"
version = "1.0.0"
description = "Streaming simulator that injects Jigsaw-shaped events into Kafka."
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiokafka==0.11.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "structlog==24.4.0",
]

[dependency-groups]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "ruff==0.7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
