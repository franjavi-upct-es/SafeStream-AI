# services/inference/alembic.ini
# Database URL is injected at runtime from POSTGRES_DSN; this file only
# defines the migration script layout.

[alembic]
script_location = alembic
prepend_sys_path = .

# Use the standard chronological filename format with a UTC timestamp
# prefix so versions sort naturally on disk.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false

# sqlalchemy.url is set programmatically in env.py so secrets stay out of
# the file. This placeholder satisfies Alembic's config validation.
sqlalchemy.url = postgresql+psycopg2://override-in-env-py

[post_write_hooks]
# (None for now. Could plug ``ruff format`` here later)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname = 

[logger_sqlalchemy]
level = WARNING
handlers = 
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = 
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
